/* Grid & Cards (Slots) */

.slot::before {

<script>
// --- AUDIO SYNTHESIZER (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'hover') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'click') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.09);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.09);
    }
  } catch(e) {}
}

let countActiveEnabled = true;

// Inizializzazione interazioni sugli slot reali
function initSlotsBehavior() {
  const slots = document.querySelectorAll('.slot');
  let activeCount = 0;

  slots.forEach(article => {
    const titleInput = article.querySelector('.slot-title');
    const urlInput = article.querySelector('.slot-url');
    const hasData = Boolean(titleInput.value.trim() || urlInput.value.trim());

    if (hasData) {
      activeCount++;
      article.classList.remove('is-empty');
      article.classList.add('is-active');
    }

    const goBtn = article.querySelector('.go');
    goBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playSound('click');
      const targetUrl = urlInput.value.trim();
      if (targetUrl) {
        window.open(targetUrl, '_blank');
      }
    });

    article.addEventListener('mouseenter', () => playSound('hover'));
  });

  updateActiveCounterDisplay(activeCount);
}

function updateActiveCounterDisplay(count) {
  const display = document.getElementById('activeCountDisplay');
  if (countActiveEnabled) {
    display.textContent = `ATTIVI: ${count} / 50`;
  } else {
    display.textContent = `CONTEGGIO DISATTIVATO`;
  }
}

// Active Counter Toggle
const activeCounterBtn = document.getElementById('activeCounterBtn');
activeCounterBtn.addEventListener('click', () => {
  playSound('click');
  countActiveEnabled = !countActiveEnabled;
  activeCounterBtn.classList.toggle('disabled', !countActiveEnabled);
  
  const activeSlots = document.querySelectorAll('.slot.is-active').length;
  updateActiveCounterDisplay(activeSlots);
});

// Search filter
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  const slots = document.querySelectorAll('.slot');

  slots.forEach(slot => {
    const title = slot.querySelector('.slot-title').value.toLowerCase();
    const url = slot.querySelector('.slot-url').value.toLowerCase();
    const num = slot.querySelector('.slot-number').textContent;

    if (title.includes(query) || url.includes(query) || num.includes(query)) {
      slot.style.display = 'flex';
    } else {
      slot.style.display = 'none';
    }
  });
});

// --- DYNAMIC MULTICOLOR CANVAS BACKGROUND ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let mouse = { x: null, y: null, radius: 170 };

const neonColors = ['#00f0ff', '#ff007f', '#9d00ff', '#00ff66', '#ffea00'];

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

window.addEventListener('mousemove', (e) => {
  mouse.x = e.x;
  mouse.y = e.y;
});

window.addEventListener('mouseleave', () => {
  mouse.x = null;
  mouse.y = null;
});

class Particle {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 2.5 + 1;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
    this.alpha = Math.random() * 0.6 + 0.3;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;

    if (mouse.x && mouse.y) {
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < mouse.radius) {
        const force = (mouse.radius - distance) / mouse.radius;
        const directionX = dx / distance;
        const directionY = dy / distance;
        this.x -= directionX * force * 4;
        this.y -= directionY * force * 4;
      }
    }
  }
}

function initParticles() {
  particles = [];
  const particleCount = Math.min(Math.floor((width * height) / 9000), 110);
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, width, height);

  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();

    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 140) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = particles[i].color;
        ctx.globalAlpha = 0.25 * (1 - dist / 140);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }
  }

  requestAnimationFrame(animateParticles);
}

window.onload = function() {
  initSlotsBehavior();
  initParticles();
  animateParticles();
};
</script>

</body>
</html>

<style>
:root {
  --bg:#070b14; --card:#101827; --text:#f3f6ff; --muted:#9aa7bd;
  --primary:#4f8cff; --primary2:#76a7ff; --border:#26344d;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:radial-gradient(circle at 50% -10%,#17284a 0,#0b1220 32%,var(--bg) 72%);
       color:var(--text); }
.container { width:min(1100px,92%); margin:auto; }
header { padding:54px 0 30px; text-align:center; }
.badge { display:inline-block; padding:7px 12px; border-radius:999px;
          background:#172a50; color:#76a7ff; font-weight:700; font-size:13px; }
h1 { margin:14px 0 10px; font-size:clamp(32px,5vw,58px); letter-spacing:-1.8px; }
.subtitle { margin:0 auto; max-width:700px; color:var(--muted); font-size:17px; }
.toolbar { display:flex; gap:12px; margin:20px 0 22px; flex-wrap:wrap; }
#search { flex:1; min-width:220px; padding:14px 16px; border:1px solid var(--border);
           border-radius:14px; font-size:15px; outline:none; }
#search:focus { border-color:#4f8cff; box-shadow:0 0 0 4px #172a50; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding-bottom:50px; }
.slot { display:flex; align-items:center; gap:12px; background:var(--card);
         border:1px solid var(--border); border-radius:18px; padding:14px;
         box-shadow:0 6px 20px rgba(31,41,55,.05); }
.slot-number { width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
                background:#182946; color:#76a7ff; font-weight:800; flex:none; }
.slot-content { min-width:0; flex:1; display:grid; gap:6px; }
.slot-content input { width:100%; border:0; outline:0; background:transparent; }
.slot-title { font-weight:750; font-size:15px; color:var(--text); }
.slot-url { color:var(--muted); font-size:13px; }
.go { border:0; background:var(--primary); color:#fff; font-weight:800; padding:11px 14px;
       border-radius:12px; cursor:pointer; }
.go:hover { background:var(--primary2); }
footer { text-align:center; color:var(--muted); padding:0 0 40px; font-size:13px; }
@media (max-width:720px) { .grid { grid-template-columns:1fr; } }









</style>

<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');

function openUrl(card) {
  const input = card.querySelector('.slot-url');
  let url = input.value.trim();
  if (!url) return alert('Inserisci prima un link.');
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  window.open(url, '_blank', 'noopener,noreferrer');
}

document.querySelectorAll('.go').forEach(btn => {
  btn.addEventListener('click', () => openUrl(btn.closest('.slot')));
});

search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim();
  document.querySelectorAll('.slot').forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(q) ? '' : 'none';
  });
});

document.querySelectorAll('.slot').forEach((card, i) => {
  const t = card.querySelector('.slot-title');
  const u = card.querySelector('.slot-url');
  t.value = localStorage.getItem('slotTitle' + i) || t.value;
  u.value = localStorage.getItem('slotUrl' + i) || u.value;
  t.addEventListener('input', () => localStorage.setItem('slotTitle' + i, t.value));
  u.addEventListener('input', () => localStorage.setItem('slotUrl' + i, u.value));
});
</script>
</body>
</html>

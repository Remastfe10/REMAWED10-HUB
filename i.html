<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>remawed10 social</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #050508;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 32px 20px;
    }

    /* Sfondo con griglia e glow laterale stile screenshot */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-left {
      position: fixed;
      top: 10%;
      left: -120px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 36, 120, 0.22), rgba(110, 40, 255, 0.08) 55%, transparent 75%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-right {
      position: fixed;
      bottom: 8%;
      right: -120px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.16), rgba(120, 45, 255, 0.08) 55%, transparent 75%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }

    .net-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
      background: linear-gradient(90deg, #ff2a85, #ffd000, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(255, 42, 133, 0.18);
    }

    /* Layout affiancato: immagine 1.jpg a sinistra, icone social a destra */
    .content-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
      width: 100%;
    }

    .image-box {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ff2a85, #ffd000, #7b2cbf, #00e5ff);
      box-shadow: 0 0 35px rgba(255, 42, 133, 0.25), 0 0 55px rgba(0, 229, 255, 0.14);
      flex-shrink: 0;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #000000;
      display: block;
    }

    .socials-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .social-btn {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      background: rgba(14, 14, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 2rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, color 0.22s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
    }

    .social-btn.discord:hover {
      transform: translateY(-5px) scale(1.04);
      color: #5865F2;
      border-color: #5865F2;
      box-shadow: 0 0 24px rgba(88, 101, 242, 0.45);
    }

    .social-btn.tiktok:hover {
      transform: translateY(-5px) scale(1.04);
      color: #ff0050;
      border-color: #00f2ea;
      box-shadow: 0 0 24px rgba(0, 242, 234, 0.35);
    }

    .social-btn.instagram:hover {
      transform: translateY(-5px) scale(1.04);
      color: #ff2a85;
      border-color: #ff2a85;
      box-shadow: 0 0 24px rgba(255, 42, 133, 0.45);
    }

    .back-btn {
      margin-top: 8px;
      padding: 13px 28px;
      border-radius: 999px;
      background: rgba(16, 16, 26, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: all 0.22s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
      background: linear-gradient(90deg, #ff2a85, #7b2cbf);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(255, 42, 133, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-left"></div>
  <div class="bg-glow-right"></div>
  <canvas id="netCanvas" class="net-canvas"></canvas>

  <main class="container">
    <h1>remawed10 social</h1>

    <section class="content-row">
      <div class="image-box">
        <img src="1.jpg" alt="remawed10" />
      </div>

      <div class="socials-box">
        <a class="social-btn discord" href="https://discord.gg/gn9f7D8gxX" target="_blank" rel="noopener noreferrer" aria-label="Discord">
          <i class="fa-brands fa-discord"></i>
        </a>
        <a class="social-btn tiktok" href="https://www.tiktok.com/@remawed10" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
        <a class="social-btn instagram" href="https://www.instagram.com/remawed10/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </section>

    <a class="back-btn" href="index.html">torna indietro</a>
  </main>

  <script>
    const canvas = document.getElementById("netCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const colors = ["#ff2a85", "#ffd000", "#00e5ff", "#a855f7", "#22c55e"];
    const nodes = Array.from({ length: 28 }, (_, i) => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 2.2 + 1.5,
      color: colors[i % colors.length]
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        a.x += a.vx;
        a.y += a.vy;

        if (a.x < 0 || a.x > canvas.width) a.vx *= -1;
        if (a.y < 0 || a.y > canvas.height) a.vy *= -1;

        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < 165) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(180, 140, 255, ${(1 - dist / 165) * 0.16})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fillStyle = a.color;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>

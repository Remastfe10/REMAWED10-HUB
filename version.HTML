<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versione Ufficiale - Portale Esterno</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Solid dark slate for high contrast */
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-8">

    <!-- Top Spacer / Container -->
    <main class="w-full max-w-2xl my-auto py-8 flex flex-col gap-8">

        <!-- SECTION 1: ULTIMA VERSIONE UFFICIALE -->
        <div class="bg-slate-800/90 border-2 border-slate-700 rounded-2xl p-6 sm:p-8 text-center shadow-2xl">
            <h2 class="text-slate-400 font-extrabold uppercase tracking-widest text-xs sm:text-sm mb-3">
                STATO DEL SOFTWARE
            </h2>
            <div class="text-2xl sm:text-4xl font-black text-white tracking-tight leading-tight">
                ULTIMA VERSIONE UFFICIALE: <span class="text-cyan-400 underline decoration-cyan-500/50">v.0.0</span>
            </div>
        </div>

        <!-- SECTION 2: EXTERNAL WEBSITE LINK -->
        <div class="bg-slate-800/90 border-2 border-indigo-500/40 rounded-2xl p-6 sm:p-8 text-center shadow-2xl flex flex-col items-center gap-6">
            <h1 class="text-xl sm:text-3xl font-extrabold text-white leading-snug">
                NON SEI NELL'ULTIMA VERSIONE?
            </h1>
            
            <p class="text-slate-300 font-bold text-lg sm:text-xl">
                SCARICA SU:
            </p>

            <!-- External Link Button -->
            <a href="https://remastfe10.github.io/REMAWED10-HUB/roblox.html" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto min-w-[280px] bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-xl py-4 px-8 rounded-xl transition-all shadow-lg shadow-cyan-500/25 active:scale-95 flex items-center justify-center gap-3">
                <i class="fa-solid fa-globe text-2xl"></i>
                <span>VISITA IL SITO UFFICIALE</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-sm opacity-75"></i>
            </a>
        </div>

        <!-- SECTION 3: VERSIONI PRECEDENTI -->
        <div class="bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-6 sm:p-8 text-center shadow-lg">
            <h3 class="text-slate-400 font-extrabold uppercase tracking-wide text-sm sm:text-base mb-4">
                VERSIONI PRECEDENTI NON PIÙ DISPONIBILI UFFICIALMENTE:
            </h3>
            
            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl">
                <p class="text-slate-500 font-extrabold tracking-widest text-base sm:text-lg uppercase">
                    NESSUNA VERSIONE PRECEDENTE
                </p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-slate-600 text-xs font-semibold pb-4">
        &copy; Official Download Portal
    </footer>

</body>
</html>
